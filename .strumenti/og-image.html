<!doctype html>
<!-- Sorgente di og-image.png (1200x630). Solo grafica locale, nessuna risorsa esterna.
     Rigenera con:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
       --force-device-scale-factor=1 --window-size=1200,630 \
       --screenshot=og-image.png "file://$PWD/.strumenti/og-image.html" -->
<html lang="it">
<head>
<meta charset="utf-8">
<title>og-image</title>
<style>
  html, body { margin: 0; width: 1200px; height: 630px; }
  body {
    box-sizing: border-box;
    padding: 72px 88px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: #0b6b66;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .barra { width: 96px; height: 8px; border-radius: 4px; background: #fff; opacity: .85; }
  h1 { margin: 0 0 20px; font-size: 92px; line-height: 1.05; font-weight: 700; letter-spacing: -.01em; }
  p { margin: 0; font-size: 44px; line-height: 1.25; opacity: .95; }
  .dominio { font-size: 34px; font-weight: 600; opacity: .85; }
</style>
</head>
<body>
  <div class="barra"></div>
  <div>
    <h1>Dott.ssa<br>Valentina Crescenzi</h1>
    <p>Medico chirurgo · Castel di Lama (AP)</p>
  </div>
  <div class="dominio">drcrescenzi.it</div>
</body>
</html>
